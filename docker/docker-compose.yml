version: '3.8'

services:
  fastapi-app:
    build: .
    container_name: fastapi_https
    ports:
      - "8443:8000"  # HTTPS port mapping
    environment:
      - ENV=production
      - MONGODB_URL=mongodb://mongo:27017/fastapi_db
    volumes:
      - ./app:/app  # Map local app directory for development
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:6.0
    container_name: mongo_db
    ports:
      - "27017:27017"  # MongoDB port mapping
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: yousician_db
    volumes:
      - ./volumes/mongo_data:/data/db
      - ./volumes/mongo_config:/data/configdb

  mongo-express:
    image: mongo-express
    container_name: mongo_express
    ports:
      - "8081:8081"  # Mongo Express UI
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin@mongo:27017/
    depends_on:
      - mongo

volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local
